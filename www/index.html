<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1b1e23">
<meta name="author" content="조민철">
<title>PDF 뷰어</title>
<style>
  :root {
    --bar: #1b1e23;
    --bar-2: #23272e;
    --line: #333944;
    --fg: #e9ecf1;
    --fg-dim: #9aa3b2;
    --accent: #4c8dff;
    --bg: #3a3f47;
    --hl: rgba(255, 196, 0, .38);
    --hl-sel: rgba(255, 110, 20, .55);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column; overflow: hidden;
    background: var(--bg); color: var(--fg);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; }

  /* ---------- toolbar ---------- */
  #bar {
    display: flex; align-items: center; gap: 4px;
    height: 52px; padding: 0 6px; flex: none;
    background: var(--bar); border-bottom: 1px solid var(--line);
  }
  .ib {
    flex: none; display: grid; place-items: center;
    min-width: 40px; height: 40px; padding: 0 6px;
    background: none; border: 0; border-radius: 8px; cursor: pointer;
  }
  .ib:hover { background: var(--bar-2); }
  .ib:active { background: var(--line); }
  .ib:disabled { opacity: .35; pointer-events: none; }
  .ib svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ib.on { color: var(--accent); }
  #fileName {
    flex: 1; min-width: 0; padding: 0 4px;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    color: var(--fg-dim); font-size: 13px;
  }
  .pager { display: flex; align-items: center; gap: 4px; flex: none; color: var(--fg-dim); font-variant-numeric: tabular-nums; }
  #pageInput {
    width: 46px; height: 32px; text-align: center;
    background: var(--bar-2); color: var(--fg);
    border: 1px solid var(--line); border-radius: 6px; font: inherit;
  }
  #pageInput:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #zoomLabel { min-width: 54px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .sep { width: 1px; height: 24px; background: var(--line); margin: 0 2px; flex: none; }

  /* ---------- search bar ---------- */
  #searchBar {
    display: flex; align-items: center; gap: 4px; flex: none;
    padding: 6px; background: var(--bar-2); border-bottom: 1px solid var(--line);
  }
  #searchBar[hidden] { display: none; }
  #q {
    flex: 1; min-width: 0; height: 38px; padding: 0 12px;
    background: var(--bar); color: var(--fg);
    border: 1px solid var(--line); border-radius: 8px; font: inherit; font-size: 16px;
  }
  #q:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #qInfo { flex: none; min-width: 64px; text-align: center; color: var(--fg-dim); font-size: 13px; font-variant-numeric: tabular-nums; }

  /* ---------- viewer ---------- */
  #viewer {
    position: relative; flex: 1; overflow: auto;
    touch-action: pan-x pan-y;
    -webkit-overflow-scrolling: touch;
  }
  #pages {
    position: relative; width: max-content; min-width: 100%;
    padding: 12px; transform-origin: 0 0;
  }
  .page {
    position: relative; margin: 0 auto 12px;
    background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.45);
    --scale-round-x: 1px; --scale-round-y: 1px;
  }
  .page::after {
    content: attr(data-num); position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%); color: #c4c9d1; font-size: 28px; font-weight: 600;
    pointer-events: none; z-index: -0;
  }
  .page.has-canvas::after { display: none; }
  .page canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* PDF.js text layer (adapted from pdf_viewer.css) */
  .textLayer {
    position: absolute; inset: 0; width: 100% !important; height: 100% !important;
    overflow: clip; opacity: 1; line-height: 1; text-align: initial;
    letter-spacing: normal; word-spacing: normal;
    -webkit-text-size-adjust: none; text-size-adjust: none; forced-color-adjust: none;
    transform-origin: 0 0; caret-color: CanvasText; z-index: 0;
    --min-font-size: 1;
    --user-unit: 1;
    --total-scale-factor: calc(var(--scale-factor) * var(--user-unit));
    --text-scale-factor: calc(var(--total-scale-factor) * var(--min-font-size));
    --min-font-size-inv: calc(1 / var(--min-font-size));
  }
  .textLayer :is(span, br) {
    color: transparent; position: absolute; white-space: pre; cursor: text;
    transform-origin: 0% 0%; -webkit-user-select: text; user-select: text;
  }
  .textLayer > :not(.markedContent), .textLayer .markedContent span:not(.markedContent) {
    z-index: 1; --font-height: 0;
    font-size: calc(var(--text-scale-factor) * var(--font-height));
    --scale-x: 1; --rotate: 0deg;
    transform: rotate(var(--rotate)) scaleX(var(--scale-x)) scale(var(--min-font-size-inv));
  }
  .textLayer .markedContent { display: contents; }
  .textLayer ::selection { background: rgba(0, 90, 255, .3); color: transparent; }
  .textLayer br::selection { background: transparent; }
  .textLayer .endOfContent {
    display: block; position: absolute; inset: 100% 0 0; z-index: 0; cursor: default; user-select: none;
  }
  .textLayer.selecting .endOfContent { top: 0; }
  .textLayer span.hl { background: var(--hl); border-radius: 2px; }
  .textLayer span.hl.sel { background: var(--hl-sel); box-shadow: 0 0 0 1px rgba(255,110,20,.9); }

  /* ---------- empty state ---------- */
  #empty {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center;
  }
  #empty[hidden] { display: none; }
  #empty .icon svg { width: 64px; height: 64px; stroke: var(--fg-dim); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  #empty h1 { margin: 0; font-size: 20px; font-weight: 600; }
  #empty p { margin: 0; color: var(--fg-dim); max-width: 320px; }
  .vh { position: fixed; left: -9999px; top: 0; width: 1px; height: 1px; opacity: 0; }
  label.primary { display: inline-flex; align-items: center; justify-content: center; }
  #emptyOpen[hidden] { display: none; }
  .primary {
    height: 48px; padding: 0 28px; border: 0; border-radius: 10px; cursor: pointer;
    background: var(--accent); color: #fff; font-size: 16px; font-weight: 600;
  }
  .primary:active { filter: brightness(.9); }
  .tips { display: grid; gap: 6px; margin-top: 8px; color: var(--fg-dim); font-size: 13px; text-align: left; }
  .tips div::before { content: "•"; margin-right: 8px; color: var(--accent); }
  body.dragging #viewer { outline: 3px dashed var(--accent); outline-offset: -10px; }

  /* ---------- toast / modal / progress ---------- */
  #progress {
    position: absolute; left: 0; top: 0; height: 3px; width: 0; z-index: 5;
    background: var(--accent); transition: width .2s, opacity .3s; opacity: 0;
  }
  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
    max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 10px;
    background: #111418; color: var(--fg); box-shadow: 0 4px 16px rgba(0,0,0,.4);
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 20;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #modal {
    position: fixed; inset: 0; z-index: 30; display: grid; place-items: center;
    background: rgba(0,0,0,.55); padding: 20px;
  }
  #modal[hidden] { display: none; }
  #modal form {
    width: 100%; max-width: 340px; padding: 20px; border-radius: 14px;
    background: var(--bar-2); display: grid; gap: 12px;
  }
  #modal h2 { margin: 0; font-size: 17px; }
  #modal .err { color: #ff8a80; font-size: 13px; margin: -4px 0 0; }
  #pw {
    height: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bar); color: var(--fg); font: inherit; font-size: 16px;
  }
  #modal .row { display: flex; gap: 8px; justify-content: flex-end; }
  .ghost { height: 40px; padding: 0 16px; border: 1px solid var(--line); border-radius: 8px; background: none; cursor: pointer; }
  #modal .primary { height: 40px; padding: 0 18px; font-size: 14px; }

  @media (max-width: 560px) {
    #fileName { display: none; }
    .pager { margin-right: auto; }
    .ib { min-width: 38px; padding: 0 4px; }
    .sep { display: none; }
  }
  .credit { margin-top: 28px; font-size: 13px; opacity: .6; text-align: center; letter-spacing: .02em; }
</style>
</head>
<body>
<header id="bar">
  <label class="ib" id="openBtn" for="file" title="PDF 열기" aria-label="PDF 열기" role="button">
    <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
  </label>
  <div id="fileName">PDF 뷰어</div>
  <div class="pager">
    <input id="pageInput" type="text" inputmode="numeric" value="–" aria-label="페이지 번호" disabled>
    <span id="pageTotal">/ 0</span>
  </div>
  <div class="sep"></div>
  <button class="ib" id="zoomOut" title="축소" aria-label="축소" disabled>
    <svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>
  </button>
  <button class="ib" id="zoomLabel" title="폭 맞춤" aria-label="폭 맞춤" disabled>–</button>
  <button class="ib" id="zoomIn" title="확대" aria-label="확대" disabled>
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <div class="sep"></div>
  <button class="ib" id="searchBtn" title="검색 (Ctrl+F)" aria-label="검색" disabled>
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
  </button>
</header>

<div id="searchBar" hidden>
  <input id="q" type="search" placeholder="문서에서 검색" enterkeyhint="search" autocomplete="off">
  <span id="qInfo"></span>
  <button class="ib" id="qPrev" title="이전 (Shift+Enter)" aria-label="이전 결과">
    <svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg>
  </button>
  <button class="ib" id="qNext" title="다음 (Enter)" aria-label="다음 결과">
    <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
  </button>
  <button class="ib" id="qClose" title="닫기 (Esc)" aria-label="검색 닫기">
    <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
  </button>
</div>

<main id="viewer">
  <div id="progress"></div>
  <div id="pages"></div>
  <div id="empty">
    <div class="icon"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg></div>
    <h1 id="emptyTitle">PDF 파일을 열어주세요</h1>
    <p id="emptyMsg">파일은 이 기기 안에서만 열리고, 어디에도 업로드되지 않아요.</p>
    <label class="primary" id="emptyOpen" for="file" role="button">PDF 열기</label>
    <div class="tips">
      <div>두 손가락으로 확대·축소</div>
      <div>돋보기 버튼으로 문서 안 글자 검색</div>
      <div>글자를 길게 눌러 선택·복사</div>
      <div>PC에서는 파일을 끌어다 놓아도 돼요</div>
    </div>
    <div class="credit">made by 조민철</div>
  </div>
</main>

<input type="file" id="file" accept="application/pdf,.pdf" class="vh">
<div id="toast" role="status"></div>
<div id="modal" hidden>
  <form id="pwForm">
    <h2>비밀번호가 필요한 PDF예요</h2>
    <p class="err" id="pwErr" hidden>비밀번호가 맞지 않아요.</p>
    <input id="pw" type="password" placeholder="비밀번호" autocomplete="off">
    <div class="row">
      <button type="button" class="ghost" id="pwCancel">취소</button>
      <button type="submit" class="primary">열기</button>
    </div>
  </form>
</div>

<script>
  window.__pending = null;
  // 안드로이드 앱: 다른 앱(카카오톡, 브라우저 등)에서 "열기"로 넘어온 PDF 받기
  window.__checkIncoming = function () {
    try {
      if (window.__incBusy || !window.AndroidPdf) return;
      var id = AndroidPdf.pendingId();
      if (!id || id === window.__lastInc) return;
      var n = AndroidPdf.chunkCount();
      if (!n) return;
      window.__incBusy = true; window.__lastInc = id;
      var name = AndroidPdf.pendingName() || "document.pdf", parts = [];
      for (var i = 0; i < n; i++) {
        var bin = atob(AndroidPdf.chunk(i)), u = new Uint8Array(bin.length);
        for (var j = 0; j < bin.length; j++) u[j] = bin.charCodeAt(j);
        parts.push(u);
      }
      var f = new File(parts, name, { type: "application/pdf" });
      if (window.__openFile) window.__openFile(f); else window.__pending = f;
    } catch (e) { alert("파일을 열지 못했어요: " + (e && e.message || e)); }
    window.__incBusy = false;
  };
  setInterval(function () { window.__checkIncoming(); }, 700);
  function __showErr(msg) {
    var t = document.getElementById("emptyTitle"), m = document.getElementById("emptyMsg");
    if (t && m && !window.__ready) { t.textContent = "문제가 생겼어요"; m.textContent = msg; }
  }
  window.addEventListener("error", function (e) { __showErr("오류: " + (e.message || e)); });
  window.addEventListener("unhandledrejection", function (e) { __showErr("오류: " + ((e.reason && e.reason.message) || e.reason)); });
  document.getElementById("file").addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    if (window.__openFile) window.__openFile(f);
    else {
      window.__pending = f;
      document.getElementById("emptyTitle").textContent = "뷰어를 준비하는 중…";
      document.getElementById("emptyMsg").textContent = f.name;
    }
    e.target.value = "";
  });
  setTimeout(function () {
    if (!window.__libReady) __showErr("PDF 라이브러리를 불러오지 못했어요. 앱을 다시 실행해 주세요.");
  }, 15000);
</script>
<script type="module">
let pdfjsLib;
try {
  pdfjsLib = await import("./pdfjs/legacy/build/pdf.min.mjs");
  window.__libReady = true;
} catch (e) {
  __showErr("PDF 라이브러리를 불러오지 못했어요: " + (e?.message || e));
  throw e;
}

const CDN = new URL("./pdfjs/", location.href).href;
pdfjsLib.GlobalWorkerOptions.workerSrc = CDN + "legacy/build/pdf.worker.min.mjs";

const $ = (id) => document.getElementById(id);
const viewer = $("viewer"), pagesEl = $("pages"), emptyEl = $("empty");
const pageInput = $("pageInput"), pageTotal = $("pageTotal"), zoomLabel = $("zoomLabel");
const searchBar = $("searchBar"), qEl = $("q"), qInfo = $("qInfo");

const IS_MOBILE = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
const MAX_PIXELS = IS_MOBILE ? 8e6 : 16e6;   // canvas pixel budget per page
const MIN_SCALE = 0.1, MAX_SCALE = 10, PAD = 12;

let doc = null, loadTask = null, pages = [], scale = 1, fitMode = true, loadToken = 0;
const visible = new Set();
let io = null;

/* ---------------- utilities ---------------- */
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
let toastTimer;
function toast(msg, ms = 2600) {
  const t = $("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), ms);
}
function progress(frac) {
  const p = $("progress");
  if (frac == null) { p.style.opacity = 0; setTimeout(() => (p.style.width = 0), 300); return; }
  p.style.opacity = 1; p.style.width = (frac * 100).toFixed(1) + "%";
}
function setControls(on) {
  for (const id of ["pageInput", "zoomOut", "zoomLabel", "zoomIn", "searchBtn"]) $(id).disabled = !on;
}

/* ---------------- open / close ---------------- */
async function openFile(file) {
  if (!file) return;
  if (!/\.pdf$/i.test(file.name) && file.type !== "application/pdf") { toast("PDF 파일만 열 수 있어요"); return; }
  let data;
  try { data = new Uint8Array(await file.arrayBuffer()); }
  catch { toast("파일을 읽지 못했어요"); return; }
  await loadDoc(data, file.name);
}

function closeDoc() {
  io?.disconnect(); io = null;
  for (const p of pages) release(p);
  visible.clear();
  pages = [];
  pagesEl.innerHTML = "";
  resetSearch();
  if (loadTask) { loadTask.destroy().catch(() => {}); loadTask = null; }
  doc = null;
  setControls(false);
}

async function loadDoc(data, name) {
  const token = ++loadToken;
  closeDoc();
  emptyEl.hidden = false;
  $("emptyTitle").textContent = "불러오는 중…";
  $("emptyMsg").textContent = name;
  $("emptyOpen").hidden = true;
  progress(0.1);

  const task = pdfjsLib.getDocument({
    data,
    cMapUrl: CDN + "cmaps/", cMapPacked: true,
    standardFontDataUrl: CDN + "standard_fonts/",
    wasmUrl: CDN + "wasm/",
    isEvalSupported: false,
  });
  loadTask = task;
  task.onProgress = ({ loaded, total }) => total && progress(0.1 + 0.6 * loaded / total);
  task.onPassword = (cb, reason) => {
    askPassword(reason === pdfjsLib.PasswordResponses.INCORRECT_PASSWORD).then((pw) => {
      if (pw == null) task.destroy(); else cb(pw);
    });
  };

  let d;
  try { d = await task.promise; }
  catch (e) {
    if (token !== loadToken) return;
    progress(null); showEmpty();
    if (e?.name === "PasswordException" || /destroy/i.test(e?.message || "")) toast("열기를 취소했어요");
    else toast("PDF를 열 수 없어요: " + (e?.message || e));
    return;
  }
  if (token !== loadToken) { d.destroy(); return; }
  doc = d;
  document.title = name + " – PDF 뷰어";
  $("fileName").textContent = name;
  $("fileName").title = name;

  const first = await doc.getPage(1);
  if (token !== loadToken) return;
  const vp1 = first.getViewport({ scale: 1 });

  const frag = document.createDocumentFragment();
  for (let i = 0; i < doc.numPages; i++) {
    const div = document.createElement("div");
    div.className = "page";
    div.dataset.num = i + 1;
    const p = {
      idx: i, num: i + 1, div,
      w1: vp1.width, h1: vp1.height, uu: vp1.userUnit || 1,
      pdfPage: i === 0 ? Promise.resolve(first) : null,
      canvas: null, renderedScale: 0, task: null, failed: false,
      text: null, tl: null, textPromise: null, textGen: 0, hlDivs: [],
    };
    div._p = p;
    pages.push(p);
    frag.appendChild(div);
  }
  pagesEl.appendChild(frag);
  emptyEl.hidden = true;
  pageTotal.textContent = "/ " + doc.numPages;
  setControls(true);

  fitMode = true;
  scale = clamp(fitWidthScale(0), MIN_SCALE, MAX_SCALE);
  for (const p of pages) sizePage(p);
  updateZoomLabel();
  viewer.scrollTop = 0; viewer.scrollLeft = 0;
  updatePageNumber();

  io = new IntersectionObserver(onIntersect, { root: viewer, rootMargin: "150% 50%" });
  for (const p of pages) io.observe(p.div);
  progress(null);

  // Pages can differ in size (mixed A1 / A3 sets); measure in the background.
  measureAllPages(token);
}

async function measureAllPages(token) {
  for (let i = 1; i < pages.length; i++) {
    const p = pages[i];
    let page;
    try { page = await getPdfPage(p); } catch { continue; }
    if (token !== loadToken) return;
    const vp = page.getViewport({ scale: 1 });
    if (Math.abs(vp.width - p.w1) > 0.5 || Math.abs(vp.height - p.h1) > 0.5 || (vp.userUnit || 1) !== p.uu) {
      const a = captureAnchor(0, 0);
      p.w1 = vp.width; p.h1 = vp.height; p.uu = vp.userUnit || 1;
      p.renderedScale = 0;
      sizePage(p);
      restoreAnchor(a);
    }
  }
}

function showEmpty() {
  emptyEl.hidden = false;
  $("emptyTitle").textContent = "PDF 파일을 열어주세요";
  $("emptyMsg").textContent = "파일은 이 기기 안에서만 열리고, 어디에도 업로드되지 않아요.";
  $("emptyOpen").hidden = false;
  document.title = "PDF 뷰어";
  $("fileName").textContent = "PDF 뷰어";
  pageTotal.textContent = "/ 0"; pageInput.value = "–"; zoomLabel.textContent = "–";
}

function askPassword(wrong) {
  return new Promise((resolve) => {
    const modal = $("modal"), form = $("pwForm"), pw = $("pw");
    $("pwErr").hidden = !wrong;
    pw.value = "";
    modal.hidden = false;
    setTimeout(() => pw.focus(), 50);
    const done = (val) => {
      modal.hidden = true;
      form.onsubmit = null; $("pwCancel").onclick = null;
      resolve(val);
    };
    form.onsubmit = (e) => { e.preventDefault(); done(pw.value); };
    $("pwCancel").onclick = () => done(null);
  });
}

/* ---------------- layout & zoom ---------------- */
function getPdfPage(p) {
  return (p.pdfPage ??= doc.getPage(p.num));
}

function sizePage(p) {
  const s = p.div.style;
  s.width = Math.floor(p.w1 * scale) + "px";
  s.height = Math.floor(p.h1 * scale) + "px";
  s.setProperty("--scale-factor", scale);
  s.setProperty("--user-unit", p.uu);
}

function fitWidthScale(i) {
  const p = pages[i] || pages[0];
  if (!p) return 1;
  const avail = viewer.clientWidth - PAD * 2;
  return avail / p.w1;
}

function pageIndexAt(y) {
  let lo = 0, hi = pages.length - 1;
  while (lo < hi) {
    const mid = (lo + hi + 1) >> 1;
    if (pages[mid].div.offsetTop <= y) lo = mid; else hi = mid - 1;
  }
  return lo;
}

function captureAnchor(ax, ay) {
  if (!pages.length) return null;
  const y = viewer.scrollTop + ay, x = viewer.scrollLeft + ax;
  const i = pageIndexAt(y), d = pages[i].div;
  return {
    i, ax, ay,
    fy: (y - d.offsetTop) / (d.offsetHeight || 1),
    fx: (x - d.offsetLeft) / (d.offsetWidth || 1),
  };
}
function restoreAnchor(a) {
  if (!a) return;
  const d = pages[a.i].div;
  viewer.scrollTop = d.offsetTop + a.fy * d.offsetHeight - a.ay;
  viewer.scrollLeft = d.offsetLeft + a.fx * d.offsetWidth - a.ax;
}

let renderDebounce;
function setScale(ns, ax, ay, keepFit = false) {
  if (!doc) return;
  ns = clamp(ns, MIN_SCALE, MAX_SCALE);
  if (!keepFit) fitMode = false;
  if (Math.abs(ns - scale) < 1e-4) { updateZoomLabel(); return; }
  if (ax == null) { ax = viewer.clientWidth / 2; ay = viewer.clientHeight / 2; }
  const a = captureAnchor(ax, ay);
  scale = ns;
  for (const p of pages) { sizePage(p); p.task?.cancel(); }
  restoreAnchor(a);
  updateZoomLabel();
  clearTimeout(renderDebounce);
  renderDebounce = setTimeout(scheduleRender, 160);
}

function updateZoomLabel() {
  zoomLabel.textContent = Math.round(scale * 100) + "%";
  zoomLabel.classList.toggle("on", fitMode);
}

function fitWidth() {
  if (!doc) return;
  const i = currentPageIndex();
  fitMode = true;
  setScale(fitWidthScale(i), 0, 0, true);
  updateZoomLabel();
}

/* ---------------- rendering ---------------- */
function onIntersect(entries) {
  for (const e of entries) {
    const p = e.target._p;
    if (e.isIntersecting) visible.add(p);
    else { visible.delete(p); release(p); }
  }
  scheduleRender();
}

let pumping = false;
async function scheduleRender() {
  if (pumping) return;
  pumping = true;
  try {
    let p;
    while ((p = nextToRender())) await renderPage(p);
  } finally { pumping = false; }
}

function nextToRender() {
  const c = viewer.scrollTop + viewer.clientHeight / 2;
  let best = null, bd = Infinity;
  for (const p of visible) {
    if (p.renderedScale === scale || p.failed) continue;
    const d = Math.abs(p.div.offsetTop + p.div.offsetHeight / 2 - c);
    if (d < bd) { bd = d; best = p; }
  }
  return best;
}

async function renderPage(p) {
  const token = loadToken, s = scale;
  let page;
  try { page = await getPdfPage(p); }
  catch { p.failed = true; return; }
  if (token !== loadToken || !visible.has(p)) return;

  const vp = page.getViewport({ scale: s });
  let os = Math.min(window.devicePixelRatio || 1, 3);
  if (vp.width * vp.height * os * os > MAX_PIXELS) os = Math.sqrt(MAX_PIXELS / (vp.width * vp.height));

  const canvas = document.createElement("canvas");
  canvas.width = Math.max(1, Math.floor(vp.width * os));
  canvas.height = Math.max(1, Math.floor(vp.height * os));
  const ctx = canvas.getContext("2d", { alpha: false });

  const task = page.render({
    canvasContext: ctx, canvas, viewport: vp,
    transform: os !== 1 ? [os, 0, 0, os, 0, 0] : null,
  });
  p.task = task;
  try {
    await task.promise;
  } catch (e) {
    canvas.width = canvas.height = 0;
    if (e?.name !== "RenderingCancelledException") { console.warn(e); p.failed = true; }
    return;
  } finally {
    if (p.task === task) p.task = null;
  }
  if (token !== loadToken || !visible.has(p)) { canvas.width = canvas.height = 0; return; }

  if (p.canvas) { p.canvas.replaceWith(canvas); p.canvas.width = p.canvas.height = 0; }
  else p.div.prepend(canvas);
  p.canvas = canvas;
  p.div.classList.add("has-canvas");
  p.renderedScale = s;
  ensureText(p);
}

function release(p) {
  p.task?.cancel(); p.task = null;
  if (p.canvas) { p.canvas.width = p.canvas.height = 0; p.canvas.remove(); p.canvas = null; }
  p.div.classList.remove("has-canvas");
  p.renderedScale = 0;
  p.failed = false;
  p.textGen++;
  p.tl?.cancel?.();
  p.text?.remove();
  p.text = null; p.tl = null; p.textPromise = null; p.hlDivs = [];
}

function ensureText(p) {
  if (p.textPromise) return p.textPromise;
  const gen = ++p.textGen;
  p.textPromise = (async () => {
    const page = await getPdfPage(p);
    const tc = await page.getTextContent();
    if (gen !== p.textGen) return null;
    const div = document.createElement("div");
    div.className = "textLayer";
    const tl = new pdfjsLib.TextLayer({
      textContentSource: tc, container: div, viewport: page.getViewport({ scale }),
    });
    await tl.render();
    if (gen !== p.textGen) return null;
    const end = document.createElement("div");
    end.className = "endOfContent";
    div.append(end);
    p.div.append(div);
    p.text = div; p.tl = tl;
    applyHighlights(p);
    return tl;
  })().catch((e) => { console.warn(e); if (gen === p.textGen) p.textPromise = null; return null; });
  return p.textPromise;
}

/* ---------------- page navigation ---------------- */
function currentPageIndex() {
  if (!pages.length) return 0;
  return pageIndexAt(viewer.scrollTop + viewer.clientHeight / 3);
}
function updatePageNumber() {
  if (document.activeElement !== pageInput && pages.length) pageInput.value = currentPageIndex() + 1;
}
function scrollToPage(i) {
  const d = pages[i]?.div;
  if (!d) return;
  viewer.scrollTop = d.offsetTop - 8;
}

let scrollRaf = 0;
viewer.addEventListener("scroll", () => {
  if (scrollRaf) return;
  scrollRaf = requestAnimationFrame(() => { scrollRaf = 0; updatePageNumber(); });
}, { passive: true });

pageInput.addEventListener("focus", () => pageInput.select());
pageInput.addEventListener("keydown", (e) => { if (e.key === "Enter") pageInput.blur(); });
pageInput.addEventListener("change", () => {
  const n = parseInt(pageInput.value, 10);
  if (n >= 1 && n <= pages.length) scrollToPage(n - 1);
  updatePageNumber();
});
pageInput.addEventListener("blur", updatePageNumber);

/* ---------------- search ---------------- */
let query = "", matches = [], cur = -1, searchGen = 0, searching = false;
const textCache = new WeakMap();

function norm(s) { return s.normalize("NFC").toLowerCase().replace(/\s+/g, ""); }

async function getSearchText(p) {
  if (textCache.has(p)) return textCache.get(p);
  const page = await getPdfPage(p);
  const tc = await page.getTextContent();
  let s = "";
  const map = [];
  let k = 0;
  for (const it of tc.items) {
    if (it.str === undefined) continue;
    const str = it.str.normalize("NFC");
    for (const ch of str) {
      if (/\s/.test(ch)) continue;
      const l = ch.toLowerCase();
      s += l;
      for (let j = 0; j < l.length; j++) map.push(k);
    }
    k++;
  }
  const res = { s, map };
  textCache.set(p, res);
  return res;
}

function resetSearch() {
  searchGen++;
  query = ""; matches = []; cur = -1; searching = false;
  for (const p of pages) applyHighlights(p);
  qInfo.textContent = "";
}

async function runSearch(raw) {
  const gen = ++searchGen;
  const q = norm(raw);
  query = q; matches = []; cur = -1;
  for (const p of pages) applyHighlights(p);
  if (!q || !doc) { qInfo.textContent = ""; return; }

  searching = true;
  const startPage = currentPageIndex();
  let jumped = false;
  for (let i = 0; i < pages.length; i++) {
    let t;
    try { t = await getSearchText(pages[i]); } catch { continue; }
    if (gen !== searchGen) return;
    let pos = t.s.indexOf(q);
    while (pos !== -1) {
      matches.push({ pi: i, a: t.map[pos], b: t.map[pos + q.length - 1] });
      pos = t.s.indexOf(q, pos + q.length);
    }
    applyHighlights(pages[i]);
    if (!jumped && i >= startPage && matches.length) {
      const first = matches.findIndex((m) => m.pi >= startPage);
      if (first !== -1) { jumped = true; goTo(first); }
    }
    if (i % 10 === 9) { qInfo.textContent = `${matches.length}건…`; await new Promise((r) => setTimeout(r)); }
  }
  if (gen !== searchGen) return;
  searching = false;
  if (!matches.length) { qInfo.textContent = "결과 없음"; return; }
  if (!jumped) goTo(0); else updateQInfo();
}

function updateQInfo() {
  if (!query) { qInfo.textContent = ""; return; }
  if (!matches.length) { qInfo.textContent = searching ? "검색 중…" : "결과 없음"; return; }
  qInfo.textContent = `${cur + 1} / ${matches.length}${searching ? "…" : ""}`;
}

function applyHighlights(p) {
  for (const d of p.hlDivs) d.classList.remove("hl", "sel");
  p.hlDivs = [];
  if (!p.tl || !query || !matches.length) return;
  const divs = p.tl.textDivs;
  for (let mi = 0; mi < matches.length; mi++) {
    const m = matches[mi];
    if (m.pi !== p.idx) continue;
    for (let k = m.a; k <= m.b; k++) {
      const d = divs[k];
      if (!d) continue;
      d.classList.add("hl");
      if (mi === cur) d.classList.add("sel");
      p.hlDivs.push(d);
    }
  }
}

async function goTo(i) {
  if (!matches.length) return;
  i = (i + matches.length) % matches.length;
  const prev = matches[cur];
  cur = i;
  updateQInfo();
  if (prev && prev.pi !== matches[i].pi) applyHighlights(pages[prev.pi]);
  const m = matches[i], p = pages[m.pi];

  const vt = viewer.scrollTop, vb = vt + viewer.clientHeight;
  if (p.div.offsetTop + p.div.offsetHeight < vt || p.div.offsetTop > vb) scrollToPage(m.pi);

  const tl = await ensureText(p);
  if (cur !== i || !tl) return;
  applyHighlights(p);
  const el = tl.textDivs[m.a];
  if (!el) return;
  const r = el.getBoundingClientRect(), vr = viewer.getBoundingClientRect();
  const outY = r.top < vr.top + 40 || r.bottom > vr.bottom - 40;
  const outX = r.left < vr.left || r.right > vr.right;
  if (outY) viewer.scrollTop += r.top - vr.top - viewer.clientHeight / 3;
  if (outX) viewer.scrollLeft += r.left - vr.left - viewer.clientWidth / 2 + r.width / 2;
}

function openSearch() {
  if (!doc) return;
  searchBar.hidden = false;
  $("searchBtn").classList.add("on");
  qEl.focus(); qEl.select();
}
function closeSearch() {
  searchBar.hidden = true;
  $("searchBtn").classList.remove("on");
  qEl.value = "";
  resetSearch();
}

let qTimer;
qEl.addEventListener("input", () => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => runSearch(qEl.value), 300);
});
qEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    e.preventDefault();
    if (norm(qEl.value) !== query) { clearTimeout(qTimer); runSearch(qEl.value); }
    else goTo(cur + (e.shiftKey ? -1 : 1));
  } else if (e.key === "Escape") closeSearch();
});
$("qNext").onclick = () => goTo(cur + 1);
$("qPrev").onclick = () => goTo(cur - 1);
$("qClose").onclick = closeSearch;
$("searchBtn").onclick = () => (searchBar.hidden ? openSearch() : closeSearch());

/* ---------------- input: buttons, keys, wheel, pinch ---------------- */
window.__openFile = openFile;
if (window.__pending) { const f = window.__pending; window.__pending = null; openFile(f); }
$("zoomIn").onclick = () => setScale(scale * 1.25);
$("zoomOut").onclick = () => setScale(scale / 1.25);
zoomLabel.onclick = fitWidth;

window.addEventListener("keydown", (e) => {
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === "f" && doc) { e.preventDefault(); openSearch(); }
  else if (mod && e.key.toLowerCase() === "o") { e.preventDefault(); $("file").click(); }
  else if (mod && (e.key === "=" || e.key === "+")) { e.preventDefault(); setScale(scale * 1.25); }
  else if (mod && e.key === "-") { e.preventDefault(); setScale(scale / 1.25); }
  else if (mod && e.key === "0") { e.preventDefault(); fitWidth(); }
  else if (e.key === "Escape" && !searchBar.hidden) closeSearch();
});

viewer.addEventListener("wheel", (e) => {
  if (!e.ctrlKey || !doc) return;
  e.preventDefault();
  const vr = viewer.getBoundingClientRect();
  setScale(scale * Math.exp(-e.deltaY * 0.0025), e.clientX - vr.left, e.clientY - vr.top);
}, { passive: false });

let pinch = null;
const dist = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
viewer.addEventListener("touchstart", (e) => {
  if (e.touches.length !== 2 || !doc) return;
  e.preventDefault();
  const [a, b] = e.touches, vr = viewer.getBoundingClientRect();
  const cx = (a.clientX + b.clientX) / 2 - vr.left, cy = (a.clientY + b.clientY) / 2 - vr.top;
  pinch = { d0: dist(a, b) || 1, cx, cy, r: 1 };
  pagesEl.style.transformOrigin = `${viewer.scrollLeft + cx}px ${viewer.scrollTop + cy}px`;
}, { passive: false });
viewer.addEventListener("touchmove", (e) => {
  if (!pinch || e.touches.length !== 2) return;
  e.preventDefault();
  pinch.r = clamp(dist(e.touches[0], e.touches[1]) / pinch.d0, MIN_SCALE / scale, MAX_SCALE / scale);
  pagesEl.style.transform = `scale(${pinch.r})`;
}, { passive: false });
const endPinch = () => {
  if (!pinch) return;
  const { r, cx, cy } = pinch;
  pinch = null;
  pagesEl.style.transform = "";
  if (Math.abs(r - 1) > 0.01) setScale(scale * r, cx, cy);
};
viewer.addEventListener("touchend", (e) => { if (e.touches.length < 2) endPinch(); });
viewer.addEventListener("touchcancel", endPinch);

let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (doc && fitMode) fitWidth(); }, 150);
});

/* drag & drop */
let dragDepth = 0;
window.addEventListener("dragenter", (e) => { e.preventDefault(); dragDepth++; document.body.classList.add("dragging"); });
window.addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove("dragging"); } });
window.addEventListener("dragover", (e) => e.preventDefault());
window.addEventListener("drop", (e) => {
  e.preventDefault(); dragDepth = 0; document.body.classList.remove("dragging");
  openFile(e.dataTransfer?.files?.[0]);
});

</script>
</body>
</html>
